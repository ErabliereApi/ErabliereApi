<div class="row py-3">
    <div class="col-12 col-lg-3 mb-3">
        <label for="copilot-erabliere" class="form-label" i18n>Érablière</label>
        <select id="copilot-erabliere" class="form-select"
                [ngModel]="erabliereId()" (ngModelChange)="erabliereId.set($event)">
            <option [ngValue]="undefined" i18n>Aucune</option>
            @for (e of erablieres(); track e.id) {
            <option [ngValue]="e.id">{{ e.nom }}</option>
            }
        </select>
        <p class="form-text" i18n>
            L'érablière sélectionnée est transmise à l'assistant comme contexte.
        </p>
    </div>
    <div class="col-12 col-lg-9" style="height: 75vh">
        <copilot-chat />
    </div>
</div>
